name: Dev preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-preview
  cancel-in-progress: true

jobs:
  build:
    name: Integrated dev build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate integrated candidate
        run: npm run ci

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: docfoundry-dev-preview
          path: out
          if-no-files-found: error
          retention-days: 14
